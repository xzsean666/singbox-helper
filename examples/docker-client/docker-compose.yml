services:
  sing-box-client:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: sing-box-client
    restart: unless-stopped
    volumes:
      - ./config/sing-box-client.json:/etc/sing-box/config.json:ro
    command: run -c /etc/sing-box/config.json

  # Example business container. Replace this with your own service - the only
  # thing that matters is `network_mode: "service:sing-box-client"` plus
  # `depends_on`, which puts it in the same network namespace as the proxy
  # client so it can reach it at 127.0.0.1 without any code changes.
  app:
    image: curlimages/curl:latest
    container_name: proxy-test-app
    network_mode: "service:sing-box-client"
    depends_on:
      - sing-box-client
    command: sleep infinity
